# Manual Windows build + GitHub Release (no tests).
# Actions tab -> "Release (Windows)" -> Run workflow -> type the version.
name: Release (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex: 0.1.0)"
        required: true
        default: "0.1.0"
      prerelease:
        description: "Marcar como pré-lançamento"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # cache cargo registry + target; also save when a later step fails (first runs failed -> nothing was cached)
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: release-windows

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Rust core -> WebAssembly for the renderer (web/pkg), only if the wasm crate uses wasm-bindgen
      - name: Build privada-wasm
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 | ConvertFrom-Json
          $wb = $meta.packages | Where-Object { $_.name -eq 'wasm-bindgen' } | Select-Object -First 1
          if (-not $wb) { Write-Host "privada-wasm has no wasm-bindgen yet - skipping (JS fallback)"; exit 0 }
          # prebuilt wasm-bindgen (no compile): matches the crate version from Cargo.lock
          $env:WB_VERSION = $wb.version
          "WB_VERSION=$($wb.version)" | Out-File -Append $env:GITHUB_ENV
          cargo build -p privada-wasm --target wasm32-unknown-unknown --release

      - name: Install wasm-bindgen (prebuilt)
        if: env.WB_VERSION != ''
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WB_VERSION }}

      - name: wasm-bindgen -> web/pkg
        if: env.WB_VERSION != ''
        run: wasm-bindgen target/wasm32-unknown-unknown/release/privada_wasm.wasm --out-dir web/pkg --target web

      # React control panel (ui/ -> web/panel)
      - name: Build panel (React)
        if: hashFiles('ui/package.json') != ''
        working-directory: ui
        run: |
          npm ci || npm install
          npm run build

      - name: Install Tauri CLI (prebuilt binary, cached by setup-node)
        run: npm install -g @tauri-apps/cli@^2 --prefer-offline --no-audit --no-fund

      - name: Build app (NSIS installer)
        working-directory: crates/privada-app
        shell: pwsh
        run: |
          # version override via a JSON file (inline JSON gets mangled by PowerShell quoting)
          @{ version = '${{ inputs.version }}' } | ConvertTo-Json -Compress | Set-Content -Path release.conf.json -Encoding utf8NoBOM
          Get-Content release.conf.json
          tauri build --bundles nsis --config release.conf.json

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            Copy-Item $_.FullName "dist-release/PrivadaTuber_${{ inputs.version }}_x64-setup.exe" }
          Copy-Item target/release/privada-app.exe "dist-release/PrivadaTuber_${{ inputs.version }}_x64-portable.exe"
          # debug symbols: lets crash dumps (AppData\Local\CrashDumps) be read with function names
          if (Test-Path target/release/privada_app.pdb) { Copy-Item target/release/privada_app.pdb "dist-release/PrivadaTuber_${{ inputs.version }}_symbols.pdb" }
          Get-ChildItem dist-release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Privada Tuber v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist-release/*
