<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Privada Tuber — preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.35 system-ui, sans-serif; color: #eee; }
  body { background: #777; transition: background .4s; }
  canvas { display: block; }
  #ui { position: fixed; top: 12px; right: 12px; width: 250px; background: rgba(15,15,20,.78); backdrop-filter: blur(6px);
        border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 30px rgba(0,0,0,.35); }
  #ui.hidden { display: none; }
  #ui h1 { font-size: 15px; margin: 0 0 8px; }
  #ui label { display: block; margin: 8px 0 3px; color: #bbb; }
  #ui select, #ui input[type=range] { width: 100%; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  button { background: #2d2f3a; color: #eee; border: 1px solid #444; border-radius: 7px; padding: 6px 9px; cursor: pointer; }
  button:hover { background: #3c3f4e; }
  button.on { background: #2f7d3b; border-color: #4caf50; }
  #meter { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  #meter > div { height: 100%; width: 0; background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336); }
  .hint { color: #999; font-size: 11px; margin-top: 8px; }
  .chk { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: #ccc; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="ui">
  <h1>🚽 Privada Tuber</h1>
  <label>Tema</label>
  <select id="theme"></select>

  <label>Animações</label>
  <div class="row">
    <button data-act="flush">💧 Descarga</button>
    <button data-act="paper">🧻 Papel</button>
    <button data-act="jump">⤴ Pulo</button>
    <button data-act="backflip">🤸 Mortal</button>
    <button data-act="no">↔ Não</button>
    <button data-act="blink">😑 Piscar</button>
    <button data-act="gargle">🫧 Gargarejo</button>
  </div>

  <label>Boca (tampa)</label>
  <div class="row"><button id="mic">🎤 Microfone</button></div>
  <div id="meter"><div></div></div>
  <label>Gate do mic (<span id="gateV">-50</span> dB)</label>
  <input id="gate" type="range" min="-80" max="-20" value="-50" />
  <label>Testar boca (vogais / consoantes)</label>
  <div class="row">
    <button data-vis="A">A</button><button data-vis="E">E</button><button data-vis="I">I</button><button data-vis="O">O</button><button data-vis="U">U</button>
    <button data-vis="M">M</button><button data-vis="F">F</button><button data-vis="S">S</button>
  </div>
  <div class="row"><input id="sayText" type="text" placeholder="Digite uma frase…" style="flex:1;min-width:0" /><button id="say">🗣 Falar</button></div>
  <label>Boca em repouso</label>
  <input id="rest" type="range" min="0" max="0.2" step="0.005" value="0.05" />
  <label>Abrir manual</label>
  <input id="mouth" type="range" min="0" max="1" step="0.01" value="0" />

  <label>Fundo</label>
  <select id="bg">
    <option value="theme">Do tema</option>
    <option value="green">Chroma verde</option>
    <option value="transparent">Transparente</option>
  </select>
  <div class="chk"><input type="checkbox" id="follow" checked /> Seguir o mouse</div>
  <div class="chk"><input type="checkbox" id="orbit" /> Girar câmera (inspecionar)</div>
  <div class="chk"><input type="checkbox" id="sound" checked /> Sons</div>
  <div class="row"><button id="export">⬇ Exportar .glb</button></div>
  <div class="hint">Teclas: F descarga · P papel · G gargarejo · K mortal · J pulo · N não · B piscar · Espaço boca · H esconde painel</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
