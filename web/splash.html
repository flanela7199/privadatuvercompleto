<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Privada Tuber</title>
<style>
  html, body { margin: 0; height: 100%; background: #101114; color: #e8e8ec; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 22px 26px;
          background: radial-gradient(ellipse at 30% 0%, #23252d 0%, #101114 70%); border: 1px solid #2a2c35; box-sizing: border-box; }
  .title { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 650; letter-spacing: .2px; }
  .title .icon { font-size: 34px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  .sub { color: #8d909c; font-size: 12px; margin: 2px 0 18px 47px; }
  .bar { height: 6px; border-radius: 3px; background: #23252d; overflow: hidden; }
  .bar > div { height: 100%; width: 4%; border-radius: 3px; background: linear-gradient(90deg, #e2b33c, #ffd76a); transition: width .25s ease; }
  .bar.indet > div { width: 30%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
  .text { margin-top: 10px; color: #b4b7c2; min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="card" data-tauri-drag-region>
  <div class="title"><span class="icon">🚽</span><span>Privada Tuber</span></div>
  <div class="sub">preparando o personagem</div>
  <div class="bar indet" id="bar"><div></div></div>
  <div class="text" id="text">iniciando…</div>
</div>
<script>
  // Listens to `loading` { progress 0..1, text } from the other pages (avatar / panel).
  const T = window.__TAURI__;
  const bar = document.getElementById('bar'), text = document.getElementById('text');
  let best = 0;
  function onLoading(p) {
    if (!p) return;
    if (typeof p.progress === 'number') {
      best = Math.max(best, Math.min(1, p.progress)); // never go backwards (several pages report)
      bar.classList.remove('indet');
      bar.firstElementChild.style.width = `${Math.max(4, best * 100).toFixed(1)}%`;
    }
    if (p.text) text.textContent = p.text;
  }
  if (T && T.event) {
    T.event.listen('loading', (e) => onLoading(e.payload));
    T.core.invoke('page_ready', { label: 'splash' });
  } else {
    // browser preview: fake progress
    let x = 0; setInterval(() => onLoading({ progress: (x = Math.min(1, x + 0.07)), text: 'carregando modelo…' }), 200);
  }
</script>
</body>
</html>
